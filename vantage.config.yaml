# Vantage project config. Manage it with vantage_config_* tools; see vantage_config_schema for every option.

targets:
  web:
    # prod: the live site. local: this worktree's dev server; Vantage fills
    # {port} with a free port (npm run dev:ssl alone still uses 3002).
    environments:
      prod: https://login.appleby.cloud
      local: "https://login.local.appleby.cloud:{port}"
    default_env: local
    dev:
      command: npm run dev:ssl
      install: npm ci
