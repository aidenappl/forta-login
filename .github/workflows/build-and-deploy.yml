name: Build and Deploy to Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  resolve-version:
    runs-on: [self-hosted, lattice-worker]
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The short commit SHA, baked in as NEXT_PUBLIC_APP_VERSION: the
      # `release` on every Monitor event.
      - name: Resolve version
        id: version
        run: |
          VERSION_VALUE=$(git rev-parse --short HEAD)
          echo "value=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION_VALUE"

  build-and-push:
    runs-on: [self-hosted, lattice-worker]
    needs: [resolve-version]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Inject Keyring secrets
        id: keyring
        uses: aidenappl/keyring-actions@v1
        with:
          url: ${{ secrets.KEYRING_URL }}
          access-key-id: ${{ secrets.KEYRING_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.KEYRING_SECRET_ACCESS_KEY }}

      # The host's shared BuildKit, not docker/setup-buildx-action: that races
      # with other runners on the shared Docker daemon. Its local layer cache
      # persists between builds, so there is no gha cache (it fails through a
      # remote builder anyway).
      - name: Use lattice-builder
        run: |
          docker buildx inspect lattice-builder >/dev/null 2>&1 \
            || docker buildx create --name lattice-builder --driver remote tcp://127.0.0.1:1234
          docker buildx inspect lattice-builder

      - name: Login to Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_URL }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          builder: lattice-builder
          provenance: false
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Every Keyring secret (NEXT_PUBLIC_COOKIE_DOMAIN, NEXT_PUBLIC_API_URL,
          # NEXT_PUBLIC_GOOGLE_CLIENT_ID, NEXT_PUBLIC_FORTA_HOME, …) plus the
          # resolved version. The Dockerfile declares which ones it uses.
          build-args: |
            ${{ steps.keyring.outputs.build-args }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.resolve-version.outputs.version }}

      - name: Deploy to Lattice
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Triggering Lattice deployment..."
          curl -sf -X POST "${{ secrets.LATTICE_DEPLOY_URL }}?container=${{ github.event.repository.name }}&commit=${{ github.sha }}" \
            --max-time 30 \
            -o /dev/null -w "HTTP %{http_code}"
          echo ""
          echo "Container redeployed successfully!"
